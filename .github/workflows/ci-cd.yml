name: CI/CD

# One workflow for checks + deploy (not two files joined by workflow_run) —
# workflow_run reads its trigger config from the default branch, so a
# dev/stage-only trigger defined there never fires until it reaches main.
# push/pull_request don't have that problem: they always run the version of
# the workflow that's actually on the commit being processed.
on:
  pull_request:
    branches: [dev, stage, main]
  push:
    branches: [dev, stage, main]

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Format, spell, lint & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: Spell check
        run: npm run spell

      - name: Lint
        run: npm run lint

      - name: Build (includes type-check)
        run: npm run build

  deploy:
    name: Deploy
    needs: checks
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve Vercel target from branch
        id: target
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "target=production" >> "$GITHUB_OUTPUT"
          else
            echo "target=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check Vercel secrets are configured
        run: |
          missing=0
          for var in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!var}" ]; then
              echo "::warning::Secret $var is not set — skipping deploy."
              missing=1
            fi
          done
          echo "missing=$missing" >> "$GITHUB_ENV"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Install Vercel CLI
        if: env.missing == '0'
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        if: env.missing == '0'
        run: >
          vercel pull --yes --environment=${{ steps.target.outputs.target }}
          --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build with Vercel
        if: env.missing == '0'
        run: >
          vercel build --target=${{ steps.target.outputs.target }}
          --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy prebuilt output
        id: deploy
        if: env.missing == '0'
        run: >
          vercel deploy --prebuilt --target=${{ steps.target.outputs.target }}
          --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Summary
        if: env.missing == '0'
        run: echo "### Deployed to \`${{ steps.target.outputs.target }}\`" >> "$GITHUB_STEP_SUMMARY"
